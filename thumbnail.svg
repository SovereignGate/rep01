<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#070d18; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="azureBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Glows -->
  <rect width="1280" height="720" fill="#070d18"/>
  <rect width="1280" height="720" fill="url(#cyanGlow)"/>
  <rect width="1280" height="720" fill="url(#purpleGlow)"/>
  <rect width="1280" height="720" fill="url(#emeraldGlow)"/>

  <!-- Geometric Grid Accents -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="580" x2="1280" y2="580"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Top Competition Badge -->
  <g filter="url(#shadow)">
    <rect x="360" y="52" width="560" height="42" rx="21" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="384" cy="73" r="6" fill="#38bdf8"/>
    <text x="648" y="79" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">MICROSOFT AGENTATHON 2026 -- TRACK 3: ARCHITECT</text>
  </g>

  <!-- Main Hero Title -->
  <text x="640" y="200" fill="url(#textGrad)" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">SOVEREIGNGATE</text>

  <!-- Subtitle -->
  <text x="640" y="248" fill="#94a3b8" font-size="21" font-weight="500" text-anchor="middle">Confidential Multi-Agent AI Gateway &amp; Governance Plane</text>
  <text x="640" y="282" fill="#38bdf8" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">AZURE AI FOUNDRY  *  ZERO DATA RETENTION  *  GDPR &amp; UK DPA</text>

  <!-- 3 Strategic Pillar Cards -->
  <!-- Card 1: Sentinel -->
  <g filter="url(#shadow)">
    <rect x="100" y="325" width="330" height="200" rx="14" fill="#0f172a" stroke="url(#azureBorder)" stroke-width="2"/>
    <rect x="120" y="345" width="80" height="24" rx="6" fill="#0284c7"/>
    <text x="160" y="362" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">AGENT 1</text>
    <text x="120" y="400" fill="#ffffff" font-size="18" font-weight="700">Compliance Sentinel</text>
    <text x="120" y="432" fill="#94a3b8" font-size="13">Deterministic PII/IP Redaction</text>
    <text x="120" y="458" fill="#94a3b8" font-size="13">Ephemeral Session-Keyed Vault</text>
    <text x="120" y="492" fill="#38bdf8" font-size="13" font-weight="600">[OK] Zero Plaintext Exposure</text>
  </g>

  <!-- Card 2: Dispatcher -->
  <g filter="url(#shadow)">
    <rect x="475" y="325" width="330" height="200" rx="14" fill="#0f172a" stroke="url(#purpleBorder)" stroke-width="2"/>
    <rect x="495" y="345" width="80" height="24" rx="6" fill="#7c3aed"/>
    <text x="535" y="362" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">AGENT 2</text>
    <text x="495" y="400" fill="#ffffff" font-size="18" font-weight="700">Sovereign Dispatcher</text>
    <text x="495" y="432" fill="#94a3b8" font-size="13">Dynamic Residency Routing</text>
    <text x="495" y="458" fill="#94a3b8" font-size="13">Azure UK South / gpt-5-mini</text>
    <text x="495" y="492" fill="#c084fc" font-size="13" font-weight="600">[OK] Training Loop Exemption</text>
  </g>

  <!-- Card 3: Reconstructor -->
  <g filter="url(#shadow)">
    <rect x="850" y="325" width="330" height="200" rx="14" fill="#0f172a" stroke="url(#emeraldBorder)" stroke-width="2"/>
    <rect x="870" y="345" width="80" height="24" rx="6" fill="#059669"/>
    <text x="910" y="362" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">AGENT 3</text>
    <text x="870" y="400" fill="#ffffff" font-size="18" font-weight="700">Reconstructor &amp; Audit</text>
    <text x="870" y="432" fill="#94a3b8" font-size="13">In-Flight Cryptographic Swap</text>
    <text x="870" y="458" fill="#94a3b8" font-size="13">Structured Compliance Ledger</text>
    <text x="870" y="492" fill="#34d399" font-size="13" font-weight="600">[OK] Tamper-Evident Telemetry</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g filter="url(#shadow)">
    <rect x="160" y="580" width="960" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    
    <g transform="translate(210, 604)">
      <text x="0" y="18" fill="#38bdf8" font-size="20" font-weight="800">0.0%</text>
      <text x="0" y="36" fill="#94a3b8" font-size="11" font-weight="600">LEAKAGE RATE</text>
    </g>

    <line x1="360" y1="595" x2="360" y2="638" stroke="#334155" stroke-width="1"/>

    <g transform="translate(400, 604)">
      <text x="0" y="18" fill="#34d399" font-size="20" font-weight="800">UK DPA &amp; GDPR</text>
      <text x="0" y="36" fill="#94a3b8" font-size="11" font-weight="600">STATUTORY BOUNDARY</text>
    </g>

    <line x1="630" y1="595" x2="630" y2="638" stroke="#334155" stroke-width="1"/>

    <g transform="translate(670, 604)">
      <text x="0" y="18" fill="#c084fc" font-size="20" font-weight="800">FOUNDRY NATIVE</text>
      <text x="0" y="36" fill="#94a3b8" font-size="11" font-weight="600">AZURE AI PROJECT CLIENT</text>
    </g>

    <line x1="890" y1="595" x2="890" y2="638" stroke="#334155" stroke-width="1"/>

    <g transform="translate(930, 604)">
      <text x="0" y="18" fill="#facc15" font-size="20" font-weight="800">ZERO</text>
      <text x="0" y="36" fill="#94a3b8" font-size="11" font-weight="600">WORKFLOW FRICTION</text>
    </g>
  </g>
</svg>